# 切换到 MySQL：启动时加 --spring.profiles.active=mysql
# 或修改 application.yml 中 spring.profiles.active: mysql
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/home_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    # 本机 MySQL 密码：设置环境变量 MYSQL_PASSWORD，或直接改这里的默认值
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: always
      encoding: UTF-8
