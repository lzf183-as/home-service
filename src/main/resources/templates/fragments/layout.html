<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · 邻家帮社区家政'">邻家帮社区家政</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f9b6c'/%3E%3Cpath d='M22 50 50 26l28 24v26H58V60H42v16H22z' fill='white'/%3E%3C/svg%3E">
</head>
<body>

<header th:fragment="header" class="site-header">
    <div class="container header-inner">
        <a class="logo" th:href="@{/}">
            <span class="logo-mark">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.5 12 3l9 7.5"/>
                    <path d="M5 9.5V21h14V9.5"/>
                </svg>
            </span>
            邻家帮
        </a>

        <nav class="nav">
            <a class="nav-link" data-nav="/" th:href="@{/}">首页</a>
            <a class="nav-link" data-nav="/services" th:href="@{/services}">全部服务</a>
            <a class="nav-link" data-nav="/orders" th:href="@{/orders}"
               th:if="${currentUser != null}">我的订单</a>
            <a class="nav-link" data-nav="/staff" th:href="@{/staff/workbench}"
               th:if="${currentUser != null and currentUser.role == 'STAFF'}">接单工作台</a>
            <a class="nav-link" data-nav="/admin" th:href="@{/admin/dashboard}"
               th:if="${currentUser != null and currentUser.role == 'ADMIN'}">管理后台</a>
        </nav>

        <div class="header-actions">
            <th:block th:if="${currentUser == null}">
                <a class="btn btn-ghost btn-sm" th:href="@{/login}">登录</a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">免费注册</a>
            </th:block>
            <th:block th:if="${currentUser != null}">
                <a class="flex-gap" th:href="@{${currentUser.role == 'STAFF' ? '/staff/workbench' : (currentUser.role == 'ADMIN' ? '/admin/dashboard' : '/profile')}}"
                   style="gap:8px; color:inherit;">
                    <span class="avatar" th:text="${#strings.substring(currentUser.realName, 0, 1)}">张</span>
                    <span style="font-size:.88rem; font-weight:600;"
                          th:text="${currentUser.realName}">张伟</span>
                </a>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button class="btn btn-ghost btn-sm" type="submit">退出</button>
                </form>
            </th:block>
        </div>
    </div>
</header>

<div th:fragment="flash">
    <div class="alert alert-success" th:if="${success}">
        <span>✓</span><span th:text="${success}">操作成功</span>
    </div>
    <div class="alert alert-error" th:if="${error}">
        <span>!</span><span th:text="${error}">操作失败</span>
    </div>
</div>

<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <div class="footer-grid">
            <div>
                <div class="logo" style="margin-bottom:10px;">
                    <span class="logo-mark">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 10.5 12 3l9 7.5"/>
                            <path d="M5 9.5V21h14V9.5"/>
                        </svg>
                    </span>
                    邻家帮
                </div>
                <p class="text-sm text-muted" style="max-width:24em;">
                    扎根社区的放心家政平台。服务人员实名认证、持证上岗，预约透明、按约上门。
                </p>
            </div>
            <div>
                <div class="footer-title">服务分类</div>
                <div class="footer-links">
                    <a th:each="c : ${navCategories}" th:href="@{/services(categoryId=${c.id})}"
                       th:text="${c.name}">日常保洁</a>
                </div>
            </div>
            <div>
                <div class="footer-title">帮助与支持</div>
                <div class="footer-links">
                    <a th:href="@{/services}">服务预约流程</a>
                    <a th:href="@{/profile}">地址与联系方式</a>
                    <a th:href="@{/orders}">订单与售后</a>
                    <span>客服电话：400-800-1234（9:00-21:00）</span>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <span>© 2026 邻家帮社区家政 · 课程设计演示项目</span>
            <span>本平台为教学演示，服务与价格均为示例数据</span>
        </div>
    </div>
</footer>

<script th:fragment="scripts" th:src="@{/js/app.js}"></script>
</body>
</html>
