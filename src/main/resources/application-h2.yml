spring:
  datasource:
    driver-class-name: org.h2.Driver
    # 文件模式，数据保存在 ./data 目录，重启不丢失
    url: jdbc:h2:file:./data/homeservice;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  # 仅 H2 开发 profile 暴露控制台，切到 MySQL 后自动关闭
  h2:
    console:
      enabled: true
      path: /h2-console
